# fly.toml app configuration file generated for torflow on 2026-09-20T11:46:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'torflow'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  kill_signal = 'SIGTERM'
  kill_timeout = '30s'

  [[http_service.checks]]
    grace_period = '30s'
    interval = '15s'
    method = 'GET'
    timeout = '5s'
    path = '/ready'

[env]
  HOST = '0.0.0.0'
  PORT = '8080'
  NODE_ENV = 'production'
  CACHE_DIR = '/tmp/torflow-cache'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
