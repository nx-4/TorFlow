services:
  - type: web
    name: torflow
    runtime: docker
    plan: free
    branch: master
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: '*'
      - key: CACHE_DIR
        value: /tmp/torflow-cache
      - key: PORT
        value: '8080'
